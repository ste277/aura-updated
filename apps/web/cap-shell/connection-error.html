<!doctype html>
<!--
  AURA-MOBILE-01-AND-ERR-01 -- Android connection-failure page.
  Static HTML and CSS only: no JavaScript, no external resources, no network.
  Loaded by AuraWebViewClient (served from bundled assets) when the app's main
  page fails to load (offline, server unreachable, HTTP 5xx). "Try again" links
  to /__aura/retry on the local origin; the native client intercepts that tap
  (it is never fetched) and reloads the failed page once, after re-checking the
  WebView minimum version. HTTP 4xx responses (e.g. 404) are not replaced.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <meta name="color-scheme" content="dark" />
    <title>Can't connect</title>
    <style>
      html {
        background: #090d16;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
        background: #090d16;
        color: #f5f1e6;
        font-family: -apple-system, system-ui, Roboto, 'Segoe UI', sans-serif;
        font-size: 16px;
        line-height: 1.5;
      }
      main {
        width: 100%;
        max-width: 28rem;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.375rem;
        font-weight: 600;
        line-height: 1.3;
      }
      h2 {
        margin: 0 0 4px;
        font-size: 1.0625rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 12px;
        color: #d5d8ea;
      }
      section {
        margin-top: 20px;
        padding: 16px;
        border: 1px solid #2a3150;
        border-radius: 12px;
        background: #111729;
      }
      section p:last-child {
        margin-bottom: 0;
      }
      .retry {
        display: block;
        margin-top: 24px;
        padding: 14px 16px;
        border-radius: 12px;
        background: #f5f1e6;
        color: #090d16;
        font-weight: 600;
        font-size: 1.0625rem;
        text-align: center;
        text-decoration: none;
      }
      .note {
        color: #b4b9d6;
        font-size: 0.9375rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Aura can't connect right now</h1>
      <p>Aura couldn't reach its service. Your device may be offline, or the service may be briefly unavailable.</p>

      <section aria-labelledby="connection-heading">
        <h2 id="connection-heading">What you can do</h2>
        <p>Check your internet connection, then tap Try again.</p>
        <p class="note">Your saved information on this device is not affected.</p>
      </section>

      <a class="retry" href="/__aura/retry">Try again</a>
    </main>
  </body>
</html>
