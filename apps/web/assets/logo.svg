<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9f6b"/>
      <stop offset="1" stop-color="#ffd98e"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="#090d16"/>
  <!-- dial ring -->
  <circle cx="512" cy="512" r="300" fill="none" stroke="#262c57" stroke-width="56"/>
  <!-- sunrise arc (the favorable window) -->
  <path d="M 512 212 A 300 300 0 0 1 812 512" fill="none" stroke="url(#arc)" stroke-width="56" stroke-linecap="round"/>
  <!-- abhijit marker -->
  <circle cx="512" cy="512" r="84" fill="#4ade80"/>
  <circle cx="512" cy="512" r="84" fill="none" stroke="#1f4d34" stroke-width="10"/>
</svg>
