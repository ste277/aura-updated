apply plugin: 'com.android.application'

android {
    namespace "com.greenarrow.auraschedule"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.greenarrow.auraschedule"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// AURA-MOBILE-01-AND-COMPAT-03: fail the Android build unless the coarse-location
// compatibility patch for @capacitor/geolocation 6.1.1 is present (applied by
// apps/web/scripts/apply-geolocation-compat-patch.mjs from npm postinstall). This
// closes the `npm ci --ignore-scripts` gap: an unpatched plugin would silently
// reintroduce the API 22-30 location failure / API 22-29 SecurityException crash.
// Verification only -- it never modifies files.
def geolocationCompatPatched = [
    'GeolocationPlugin.java': '5c4ba692153db8ca92205cfab0467aa6cfc5408191758513a757564ffe584791',
    'Geolocation.java'      : '1861133e350a294d401c3ca0d639ca1b191d28ef39e186ad1ad05d9e3e9edf8b',
]
tasks.register('verifyGeolocationCompatPatch') {
    doLast {
        def dir = file("${rootDir}/../node_modules/@capacitor/geolocation/android/src/main/java/com/capacitorjs/plugins/geolocation")
        geolocationCompatPatched.each { name, expected ->
            def f = new File(dir, name)
            if (!f.exists()) {
                throw new GradleException("@capacitor/geolocation source missing: ${f}. Run `npm install` in apps/web.")
            }
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()
            if (actual != expected) {
                throw new GradleException("@capacitor/geolocation ${name} does not carry the AND-COMPAT-03 coarse-location patch (sha256 ${actual}). Run `npm install` in apps/web (scripts must not be disabled), or `node scripts/apply-geolocation-compat-patch.mjs`.")
            }
        }
    }
}
tasks.named('preBuild') { dependsOn 'verifyGeolocationCompatPatch' }
