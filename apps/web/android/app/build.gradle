apply plugin: 'com.android.application'

// AURA-ANDROID-REL-04: validated version values (see defaultConfig).
def auraVersionCode() {
    def raw = (project.findProperty('auraVersionCode') ?: '1').toString().trim()
    if (!(raw ==~ /[1-9][0-9]{0,9}/) || raw.toLong() > 2100000000L) {
        throw new GradleException("auraVersionCode must be a whole number from 1 to 2100000000 (got '${raw}').")
    }
    return raw.toInteger()
}
def auraVersionName() {
    def raw = (project.findProperty('auraVersionName') ?: '1.0').toString().trim()
    if (!(raw ==~ /[0-9]+(\.[0-9]+){1,3}/)) {
        throw new GradleException("auraVersionName must look like 1.0 or 1.0.1 (got '${raw}').")
    }
    return raw
}

android {
    namespace "com.greenarrow.auraschedule"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.greenarrow.auraschedule"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // AURA-ANDROID-REL-04: release versioning from Gradle properties, e.g.
        //   ./gradlew bundleRelease -PauraVersionCode=2 -PauraVersionName=1.0.1
        // versionCode must rise with every upload to Google Play. The defaults keep
        // local debug builds unchanged.
        versionCode auraVersionCode()
        versionName auraVersionName()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// AURA-MOBILE-01-AND-COMPAT-03: fail the Android build unless the coarse-location
// compatibility patch for @capacitor/geolocation 6.1.1 is present (applied by
// apps/web/scripts/apply-geolocation-compat-patch.mjs from npm postinstall). This
// closes the `npm ci --ignore-scripts` gap: an unpatched plugin would silently
// reintroduce the API 22-30 location failure / API 22-29 SecurityException crash.
// Verification only -- it never modifies files.
def geolocationCompatPatched = [
    'GeolocationPlugin.java': '5c4ba692153db8ca92205cfab0467aa6cfc5408191758513a757564ffe584791',
    'Geolocation.java'      : '1861133e350a294d401c3ca0d639ca1b191d28ef39e186ad1ad05d9e3e9edf8b',
]
tasks.register('verifyGeolocationCompatPatch') {
    doLast {
        def dir = file("${rootDir}/../node_modules/@capacitor/geolocation/android/src/main/java/com/capacitorjs/plugins/geolocation")
        geolocationCompatPatched.each { name, expected ->
            def f = new File(dir, name)
            if (!f.exists()) {
                throw new GradleException("@capacitor/geolocation source missing: ${f}. Run `npm install` in apps/web.")
            }
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()
            if (actual != expected) {
                throw new GradleException("@capacitor/geolocation ${name} does not carry the AND-COMPAT-03 coarse-location patch (sha256 ${actual}). Run `npm install` in apps/web (scripts must not be disabled), or `node scripts/apply-geolocation-compat-patch.mjs`.")
            }
        }
    }
}
tasks.named('preBuild') { dependsOn 'verifyGeolocationCompatPatch' }

// AURA-ANDROID-REL-04: release-build configuration gate. A release APK/AAB must load
// the hosted HTTPS app, never a development server, and must keep the WebView floor
// page that only `npx cap sync android` (not a combined `npx cap sync`) writes. This
// task reads the generated capacitor.config.json (gitignored, written by cap sync)
// and fails the release build otherwise. Debug builds are not affected. Verification
// only -- it never modifies files.
tasks.register('verifyReleaseServerConfig') {
    doLast {
        def f = file('src/main/assets/capacitor.config.json')
        if (!f.exists()) {
            throw new GradleException("Release build: ${f} is missing. Run `CAP_SERVER_URL=https://<production-host> npx cap sync android` in apps/web first.")
        }
        def cfg = new groovy.json.JsonSlurper().parse(f)
        def server = cfg.server ?: [:]
        def url = (server.url ?: '').toString()
        def problems = []
        URI uri = null
        try { uri = new URI(url) } catch (Exception ignored) { }
        def host = uri?.host?.toLowerCase() ?: ''
        if (uri == null || uri.scheme != 'https' || host.isEmpty()) {
            problems << "server.url must be an https:// URL (got '${url}')"
        } else if (host == 'localhost' || host.endsWith('.localhost') || host ==~ /(127|10)\.\d+\.\d+\.\d+/ ||
                   host ==~ /192\.168\.\d+\.\d+/ || host ==~ /172\.(1[6-9]|2\d|3[01])\.\d+\.\d+/ || host.endsWith('.local')) {
            problems << "server.url points at a local or private development host (${host})"
        }
        if (server.cleartext == true) problems << 'server.cleartext must not be true'
        if (server.errorPath != 'unsupported-webview.html') problems << 'server.errorPath is missing: sync with `npx cap sync android`, not a combined `npx cap sync`'
        if ((cfg.android ?: [:]).minWebViewVersion != 91) problems << 'android.minWebViewVersion must be 91'
        if (!problems.isEmpty()) {
            throw new GradleException('Release build blocked by AURA-ANDROID-REL-04 configuration gate:\n - ' + problems.join('\n - '))
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'verifyReleaseServerConfig' }
