name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  math-core-tests:
    name: Ephemeris / panchang tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install root deps
        run: npm install
      - name: Run ephemeris test
        run: npx ts-node test/ephemeris.test.ts
      - name: Run integration test
        run: npx ts-node test/integration.test.ts
      - name: Run timezone test
        run: npx ts-node test/timezone.test.ts
      - name: Run window notifications test
        run: npx ts-node test/windowNotifications.test.ts
      - name: Run activity ontology test
        run: npx ts-node test/activityOntology.test.ts
      - name: Run muhurta reasons test
        run: npx ts-node test/muhurtaReasons.test.ts
      - name: Run timing search test
        run: npx ts-node test/timingSearch.test.ts
      - name: Run timing search API validation test
        run: npx ts-node test/timingSearchApi.test.ts
      - name: Run panchang day service test
        run: npx ts-node test/panchangDay.test.ts
      - name: Run panchang month service test
        run: npx ts-node test/panchangMonth.test.ts
      - name: Run window overlap test
        run: npx ts-node test/windowOverlap.test.ts
      - name: Run day activity suggestions test
        run: npx ts-node test/dayActivitySuggestions.test.ts
      - name: Run everyday activity catalog test
        run: npx ts-node test/activityCatalogEveryday.test.ts
      - name: Run Muhurtham Finder test
        run: npx ts-node test/muhurthamFinder.test.ts
      - name: Run Muhurtham search API validation test
        run: npx ts-node test/muhurthamSearchApi.test.ts
      - name: Run Muhurta rule packs test
        run: npx ts-node test/muhurtaRulePacks.test.ts
      - name: Run Personal Muhurtham test
        run: npx ts-node test/personalMuhurtham.test.ts
      - name: Run SavedPerson request validation test
        run: npx ts-node test/savedPersonRequest.test.ts
      - name: Run SavedPerson natal context test
        run: npx ts-node test/savedPersonNatalContext.test.ts
      - name: Run Shared Muhurtham test
        run: npx ts-node test/sharedMuhurtham.test.ts
      - name: Run everyday shared timing fit test
        run: npx ts-node test/everydayTimingFit.test.ts
      - name: Run score engine test
        run: npx ts-node test/scoreEngine.test.ts
      - name: Run Aura Moment alternatives (rescheduling) test
        run: npx ts-node test/auraMomentAlternatives.test.ts
      - name: Run Aura Moment request validation test
        run: npx ts-node test/auraMomentRequest.test.ts
      - name: Run Aura Updates test
        run: npx ts-node test/auraUpdates.test.ts
      - name: Run product metrics test
        run: npx ts-node test/productMetrics.test.ts
      - name: Run Home dashboard time-left formatting test
        run: npx ts-node test/formatTimeLeft.test.ts
      - name: Run Intentional Day Builder domain test
        run: npx ts-node test/dayBuilder.test.ts
      # Goals V2 Rhythm structural guards -- reads apps/web source files as
      # plain text via `fs`/`path` only (no module import of anything under
      # apps/web/lib), so it needs no apps/web/node_modules and belongs in
      # this root-deps-only group, not the "Install web deps" group below.
      - name: Run Goal Activity Rhythm structural guards test
        run: npx ts-node test/goalActivityRhythmStructuralGuards.test.ts
      # Goals V2 Candidate A3.3 -- imports planDayEntry.ts/goalDemandIntentId.ts
      # only, neither of which imports db.ts/`pg` anywhere in their own
      # import graphs (confirmed: planDayEntry.ts is itself a client-safe
      # module, imported by PlanDayClient.tsx, a 'use client' component --
      # it cannot depend on `pg` by construction). Needs no apps/web/node_modules,
      # same root-deps-only group as the structural guards test above.
      - name: Run Automatic Goal suggestion inclusion test
        run: npx ts-node test/autoGoalSuggestionInclusion.test.ts
      # Goals V2 Candidate A3.4 -- goalDemandIntentId.ts's own one real
      # dependency (isValidCalendarDateString, packages/panchang/src/localDate.ts)
      # is itself zero-import, so this test needs no apps/web/node_modules.
      - name: Run Goal demand intent id test
        run: npx ts-node test/goalDemandIntentId.test.ts
      # Goals V2 Candidate A3.4 -- goalDemandProvenanceAuthorization.ts
      # imports goalDemandIntentId.ts (zero-dependency) plus TYPE-ONLY
      # imports from dayConstructorAcceptance.ts (fully erased at compile
      # time, never actually resolved at runtime) -- needs no
      # apps/web/node_modules either.
      - name: Run Goal demand provenance authorization test
        run: npx ts-node test/goalDemandProvenanceAuthorization.test.ts
      # Goals V2 Candidate A3.4 -- reads source as plain text via `fs`/`path`
      # only, same convention as the structural guards test above.
      - name: Run Goal demand provenance authorization structural guards test
        run: npx ts-node test/goalDemandProvenanceAuthorizationStructuralGuards.test.ts
      # Goals V2 Candidate B1 -- apps/web/lib/goals.ts imports only
      # packages/recommendation/src/personalizedTasks.ts (itself one
      # type-only import, erased at compile time) and the zero-dependency
      # apps/web/lib/goalCompletion.ts -- needs no apps/web/node_modules,
      # same root-deps-only group as the structural guards tests above.
      - name: Run Goal template category matching test
        run: npx ts-node test/goalTemplateCategoryMatching.test.ts
      # test/savedPersonDb.test.ts, test/auraMomentsDb.test.ts,
      # test/auraUpdatesDb.test.ts, test/productEventsDb.test.ts, and
      # test/dayBuilderDb.test.ts are intentionally NOT run here -- they
      # make real INSERT/SELECT/UPDATE/DELETE calls against Postgres via a
      # live DATABASE_URL, and this job has no Postgres service provisioned.
      # Run them locally against a real database instead (see each file's
      # own doc comment for the exact command).
      - name: Install web deps
        working-directory: apps/web
        run: npm install
      # test/auraMoments.test.ts imports apps/web/lib/auraMoments.ts, which
      # imports a `next/server` TYPE (NextRequest) -- ts-node's module
      # resolution walks up from that file's own directory, so it needs
      # apps/web/node_modules (installed above) to exist, unlike every
      # other DB-free test in this job, which never import anything from
      # the `next` package.
      - name: Run Aura Moment test
        run: npx ts-node test/auraMoments.test.ts
      # test/productEvents.test.ts imports apps/web/lib/productEvents.ts,
      # which imports apps/web/lib/db.ts (for its `pg` dependency) -- same
      # apps/web/node_modules requirement as the Aura Moment test above, so
      # it also has to run after "Install web deps".
      - name: Run product events validation test
        run: npx ts-node test/productEvents.test.ts
      # Goals V2 Candidate A1 -- goalDemandCandidates.ts imports apps/web/lib/db.ts
      # (for its `pg` dependency), same apps/web/node_modules requirement as
      # the Aura Moment/product events tests above.
      - name: Run Goal demand candidates test
        run: npx ts-node test/goalDemandCandidates.test.ts
      # Goals V2 Candidate A2 -- goalPlanningSourceAdapter.ts imports
      # dayConstructorPreviewRequest.ts, which transitively imports
      # apps/web/lib/db.ts -- same apps/web/node_modules requirement.
      - name: Run Goal planning-source adapter test
        run: npx ts-node test/goalPlanningSourceAdapter.test.ts
      # Goals V2 Candidate A3.2 -- resolveAutomaticGoalDemand (planDayBootstrap.ts)
      # imports goalDemandCandidates.ts, same apps/web/node_modules requirement.
      - name: Run Automatic Goal demand bootstrap test
        run: npx ts-node test/automaticGoalDemandBootstrap.test.ts
      - name: Run Plan-with-Aura view logic test
        env:
          TS_NODE_COMPILER_OPTIONS: '{"jsx":"react"}'
        run: npx ts-node test/planWithAuraViewLogic.test.ts
      - name: Run Panchang calendar logic test
        env:
          TS_NODE_COMPILER_OPTIONS: '{"jsx":"react"}'
        run: npx ts-node test/panchangCalendarLogic.test.ts
      - name: Run Muhurtham Finder view logic test
        env:
          TS_NODE_COMPILER_OPTIONS: '{"jsx":"react"}'
        run: npx ts-node test/muhurthamFinderViewLogic.test.ts
      - name: Run Home dashboard logic test
        env:
          TS_NODE_COMPILER_OPTIONS: '{"jsx":"react"}'
        run: npx ts-node test/homeDashboardLogic.test.ts
      # Goals V2 Candidate B2 (resumed) -- goalActivityProposal.ts imports
      # a type-only RhythmPickerValue from the 'use client'
      # components/RhythmPicker.tsx, same jsx-enabled/apps-web-node_modules
      # requirement as the Home dashboard logic test above.
      - name: Run Goal activity proposal test
        env:
          TS_NODE_COMPILER_OPTIONS: '{"jsx":"react"}'
        run: npx ts-node test/goalActivityProposal.test.ts
      # Goals V2 Candidate B3.1 -- goalCreateIdempotency.ts imports only
      # the Node `crypto` builtin plus the zero-dependency
      # goalCompletion.ts/goalActivityRhythm.ts -- needs no jsx, no
      # apps/web/node_modules.
      - name: Run Goal create idempotency test
        run: npx ts-node test/goalCreateIdempotency.test.ts
      # Goals -> Planning Integration V1 PR A -- goals.ts and the goal
      # creation wiring, unaffected by `pg`/`next` at module load, so no
      # apps/web/node_modules needed (confirmed by running both locally
      # with apps/web/node_modules removed).
      - name: Run Goals domain test
        run: npx ts-node test/goals.test.ts
      - name: Run Goals wiring test
        run: npx ts-node test/goalsWiring.test.ts
      # Goals -> Planning Integration V1 PR B -- pure presentation
      # formatting, same zero-dependency goals.ts chain as above.
      - name: Run Goals presentation test
        run: npx ts-node test/goalsPresentation.test.ts
      # Goals -> Planning Integration V1 PR C -- the Goal -> Plan My Day
      # handoff. planDayBootstrap.ts's own import chain reaches
      # apps/web/lib/db.ts (via goalDemandCandidates.ts), same
      # apps/web/node_modules requirement as the Goal demand
      # candidates/bootstrap tests above; the UI/wiring suites read
      # source as plain text only and need neither.
      - name: Run Goal planning handoff test
        run: npx ts-node test/goalPlanningHandoff.test.ts
      - name: Run Goal planning handoff UI test
        run: npx ts-node test/goalPlanningHandoffUi.test.ts
      - name: Run Goal planning handoff wiring test
        run: npx ts-node test/goalPlanningHandoffWiring.test.ts
      # Goals V2 G2.1 -- Goal activity completion requirements
      # (goalCompletion.ts), a zero-dependency module.
      - name: Run Goal completion test
        run: npx ts-node test/goalCompletion.test.ts
      - name: Run Goal completion structural guards test
        run: npx ts-node test/goalCompletionStructuralGuards.test.ts
      # Goals V2 G2.2.1/G2.2.2/G2.2.3 -- GoalActivityExecution domain
      # logic (goalActivityExecution.ts imports only the zero-dependency
      # goalCompletion.ts); live-DB/completion/Move-continuity coverage
      # for the same ticket runs in the day-constructor-acceptance-db-tests
      # job below.
      - name: Run Goal activity execution test
        run: npx ts-node test/goalActivityExecution.test.ts
      - name: Run Goal activity execution structural guards test
        run: npx ts-node test/goalActivityExecutionStructuralGuards.test.ts
      # Goals V2 Rhythm R1 -- GoalActivityOccurrence structural guards
      # (reads source as plain text, same fs/path convention as the
      # structural guards tests above); live persistence coverage for the
      # same ticket runs in the day-constructor-acceptance-db-tests job.
      - name: Run Goal activity occurrence structural guards test
        run: npx ts-node test/goalActivityOccurrenceStructuralGuards.test.ts
      # Goals V2 Rhythm R2 -- GoalActivityRhythm validation/eligibility
      # domain logic (goalActivityRhythm.ts imports only
      # availabilityContext.ts/timezone.ts, neither of which reaches `pg`).
      - name: Run Goal activity rhythm test
        run: npx ts-node test/goalActivityRhythm.test.ts
      # Goals V2 Rhythm R3 -- occurrence materialization structural
      # guards (plain-text source reads only).
      - name: Run Goal activity rhythm materialization structural guards test
        run: npx ts-node test/goalActivityRhythmMaterializationStructuralGuards.test.ts
      # Goals V2 Rhythm R4 -- Goal Detail's weekly Rhythm presentation.
      # The UI suite imports goalsPresentation.ts's formatters directly
      # (itself zero-dependency); the structural guards suite reads
      # source as plain text -- neither needs apps/web/node_modules.
      - name: Run Goal activity rhythm Goal Detail structural guards test
        run: npx ts-node test/goalActivityRhythmGoalDetailStructuralGuards.test.ts
      - name: Run Goal activity rhythm Goal Detail UI test
        run: npx ts-node test/goalActivityRhythmGoalDetailUi.test.ts
      # Goals V2 Rhythm R5 -- minimum Rhythm setup UX structural guards
      # (plain-text source reads only). test/goalActivityRhythmSetupUi.test.ts
      # is intentionally NOT wired in here -- it asserts on a CreateGoalModal
      # shape (isOngoingTemplate/GOAL_TEMPLATE_LIKELY_ONGOING) that the
      # later Goals V2 Candidate B2/B3 activity-proposal review flow has
      # since replaced; it currently fails 5 checks against the real
      # GoalsListClient.tsx and needs a maintainer decision (update vs
      # retire this suite), not a blind wire-in.
      - name: Run Goal activity rhythm setup structural guards test
        run: npx ts-node test/goalActivityRhythmSetupStructuralGuards.test.ts
      # Goals V2 G3.1 -- Goal progress context threading onto the Daily
      # Agenda/Home timeline (dailyAgenda.ts/homeTimelineComposer.ts import
      # PlannedActivity/PlanGoalContext from db.ts as TYPES only, erased at
      # compile time -- no apps/web/node_modules needed).
      - name: Run Daily agenda Goal context test
        run: npx ts-node test/dailyAgendaGoalContext.test.ts
      - name: Run Goal context structural guards test
        run: npx ts-node test/goalContextStructuralGuards.test.ts
      # Goals V2 G3.2 -- Goal Detail completion presentation structural
      # guards (plain-text source reads only).
      - name: Run Goal Detail completion structural guards test
        run: npx ts-node test/goalDetailCompletionStructuralGuards.test.ts
      # Goals V2 G3.3 -- Right Now completion presentation, same
      # zero-dependency goalActivityExecution.ts/goalsPresentation.ts
      # chain as G2.1/G2.2 above.
      - name: Run Right Now Goal context test
        run: npx ts-node test/rightNowGoalContext.test.ts
      # Goals V2 G3.4 -- template completion requirement inference
      # (imports only the zero-dependency goals.ts/goalCompletion.ts/
      # goalActivityExecution.ts).
      - name: Run Goal template completion test
        run: npx ts-node test/goalTemplateCompletion.test.ts
      # Goals V2 G3.5 -- goal-aware Recomposition presentation. Requires
      # RecompositionCard.tsx at runtime (`require`d directly, same
      # renderToStaticMarkup convention as the Goal activity proposal test
      # above) -- same jsx-enabled/apps-web-node_modules requirement.
      # Live-DB coverage for the same ticket runs in the
      # day-constructor-acceptance-db-tests job below.
      - name: Run Goal-aware Recomposition presentation test
        env:
          TS_NODE_COMPILER_OPTIONS: '{"jsx":"react"}'
        run: npx ts-node test/goalAwareRecompositionPresentation.test.ts
  web-build:
    name: Next.js production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install root deps
        run: npm install
      - name: Install web deps
        working-directory: apps/web
        run: npm install
      - name: Build
        working-directory: apps/web
        env:
          # Dummy values so the build step doesn't fail on missing env vars.
          # Nothing in this project queries the DB at build time (all data
          # fetching is client-side), so these never actually get used here.
          DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder
          AUTH_SECRET: ci-placeholder-secret-not-for-production
        run: npm run build
  db-migration-validation:
    # Database Migration Baseline Reconciliation V1 (PR A) -- proves the
    # complete repository migration chain (apps/web/prisma/migrations/,
    # 0001 through the latest) builds a brand-new Postgres database from
    # zero via the exact command production uses (`prisma migrate deploy`
    # -- confirmed via the real _prisma_migrations ledger to be the
    # mechanism already in historical use, not merely intended). This is
    # the ONLY thing this job proves: that the migration chain itself is
    # complete and internally consistent. It does NOT prove production has
    # received any given migration -- that remains a separate, deployment-
    # time concern (PR B). Disposable, ephemeral Postgres service only;
    # no production secret of any kind is used or required.
    name: Database migration validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aura_ci
          POSTGRES_PASSWORD: aura_ci
          POSTGRES_DB: aura_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aura_ci -d aura_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable CI-only database -- never production, never Vercel/Neon.
      DATABASE_URL: postgresql://aura_ci:aura_ci@localhost:5432/aura_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install web deps
        working-directory: apps/web
        run: npm install
      - name: Apply the complete migration chain to a fresh database
        working-directory: apps/web
        run: npx prisma migrate deploy
      - name: Verify migration status is up to date
        working-directory: apps/web
        run: npx prisma migrate status
      - name: Verify every repository migration was recorded as applied
        run: |
          set -euo pipefail
          expected="$(find apps/web/prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          # count(DISTINCT migration_name), not raw row count: a migration
          # that failed once and succeeded on retry (this has happened in
          # production's own real ledger) legitimately has more than one
          # row for the same name -- only the successful, non-rolled-back
          # name should count once.
          applied="$(PGPASSWORD=aura_ci psql -h localhost -U aura_ci -d aura_ci -tAc \
            "SELECT count(DISTINCT migration_name) FROM \"_prisma_migrations\" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL;")"
          echo "expected migration directories: $expected"
          echo "successfully applied, recorded migrations: $applied"
          if [ "$expected" != "$applied" ]; then
            echo "::error::Migration count mismatch: $expected migration directories under apps/web/prisma/migrations/ but only $applied recorded as successfully applied in _prisma_migrations."
            exit 1
          fi
      - name: Verify the two columns behind the recent production incidents
        run: |
          set -euo pipefail
          PGPASSWORD=aura_ci psql -h localhost -U aura_ci -d aura_ci -v ON_ERROR_STOP=1 -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_name = 'HabitLog' AND column_name = 'activityId'
                  AND data_type = 'text' AND is_nullable = 'YES'
              ) THEN
                RAISE EXCEPTION 'HabitLog.activityId is missing or has an unexpected shape (expected: text, nullable)';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_name = 'PlannedActivity' AND column_name = 'activityId'
                  AND data_type = 'text' AND is_nullable = 'YES'
              ) THEN
                RAISE EXCEPTION 'PlannedActivity.activityId is missing or has an unexpected shape (expected: text, nullable)';
              END IF;
            END \$\$;
          "
  day-constructor-acceptance-db-tests:
    # Day Constructor V1 PR E2 -- the live-Postgres test job for Day
    # Constructor acceptance persistence
    # (test/dayConstructorAcceptancePersistenceDb.test.ts). Its own atomic
    # multi-item save, rollback, replay, concurrency, and set-identity
    # collision behavior all depend materially on real Postgres
    # transactions/advisory locks, which no DB-free job can exercise --
    # this is a dedicated job (not bundled into math-core-tests, which has
    # no Postgres service, and deliberately not folded into
    # db-migration-validation, which proves a different, narrower thing:
    # that the migration chain itself is complete). Same disposable,
    # ephemeral Postgres service pattern as db-migration-validation above
    # -- never production, never Vercel/Neon.
    #
    # Goals V2 Candidate A3.1 -- this job's own already-correct
    # Postgres-service/migrate-deploy environment is also the smallest
    # existing home for test/goalDemandCandidatesDb.test.ts (Candidate A1),
    # which depends on the exact same real-transaction/advisory-lock
    # machinery (materializeGoalActivityRhythmOccurrence) -- no second
    # Postgres-backed job was created for it.
    name: Day Constructor acceptance DB tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aura_ci
          POSTGRES_PASSWORD: aura_ci
          POSTGRES_DB: aura_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aura_ci -d aura_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://aura_ci:aura_ci@localhost:5432/aura_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install root deps
        run: npm install
      - name: Install web deps
        working-directory: apps/web
        run: npm install
      - name: Apply the complete migration chain to a fresh database
        working-directory: apps/web
        run: npx prisma migrate deploy
      - name: Run Day Constructor acceptance persistence DB tests
        run: npx ts-node test/dayConstructorAcceptancePersistenceDb.test.ts
      - name: Run Goal demand candidates DB test
        run: npx ts-node test/goalDemandCandidatesDb.test.ts
      - name: Run Automatic Goal demand bootstrap DB test
        run: npx ts-node test/automaticGoalDemandBootstrapDb.test.ts
      - name: Run Goal demand provenance authorization DB test
        run: npx ts-node test/goalDemandProvenanceAuthorizationDb.test.ts
      - name: Run automatic Goal lifecycle closure DB test
        run: npx ts-node test/automaticGoalLifecycleClosureDb.test.ts
      - name: Run Goals reviewed-create DB test
        run: npx ts-node test/goalsReviewedCreateDb.test.ts
      - name: Run Goals create idempotency DB test
        run: npx ts-node test/goalsCreateIdempotencyDb.test.ts
      # Goals -> Planning Integration V1 PR A/PR C -- live-database
      # coverage for the original Goal creation/handoff flows.
      - name: Run Goals DB test
        run: npx ts-node test/goalsDb.test.ts
      - name: Run Goal planning handoff DB test
        run: npx ts-node test/goalPlanningHandoffDb.test.ts
      # Goals V2 G2.2.1/G2.2.2/G2.2.3 -- GoalActivityExecution
      # persistence, completion, and Move continuity.
      - name: Run Goal activity execution DB test
        run: npx ts-node test/goalActivityExecutionDb.test.ts
      - name: Run Goal activity execution completion DB test
        run: npx ts-node test/goalActivityExecutionCompletionDb.test.ts
      - name: Run Goal activity execution Move continuity DB test
        run: npx ts-node test/goalActivityExecutionMoveContinuityDb.test.ts
      # Goals V2 Rhythm R1-R5 -- GoalActivityOccurrence/GoalActivityRhythm
      # persistence, materialization, Goal Detail display, and setup.
      - name: Run Goal activity occurrence DB test
        run: npx ts-node test/goalActivityOccurrenceDb.test.ts
      - name: Run Goal activity rhythm DB test
        run: npx ts-node test/goalActivityRhythmDb.test.ts
      - name: Run Goal activity rhythm materialization DB test
        run: npx ts-node test/goalActivityRhythmMaterializationDb.test.ts
      - name: Run Goal activity rhythm Goal Detail DB test
        run: npx ts-node test/goalActivityRhythmGoalDetailDb.test.ts
      - name: Run Goal activity rhythm setup DB test
        run: npx ts-node test/goalActivityRhythmSetupDb.test.ts
      # Goals V2 G3.1/G3.4/G3.5 -- Goal progress context, template
      # completion, and goal-aware Recomposition, each against a real
      # Postgres database.
      - name: Run Goal context DB test
        run: npx ts-node test/goalContextDb.test.ts
      - name: Run Goal template completion DB test
        run: npx ts-node test/goalTemplateCompletionDb.test.ts
      - name: Run Goal-aware Recomposition presentation DB test
        run: npx ts-node test/goalAwareRecompositionPresentationDb.test.ts
