name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  math-core-tests:
    name: Ephemeris / panchang tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install root deps
        run: npm install
      - name: Run ephemeris test
        run: npx ts-node test/ephemeris.test.ts
      - name: Run integration test
        run: npx ts-node test/integration.test.ts
      - name: Run timezone test
        run: npx ts-node test/timezone.test.ts
      - name: Run window notifications test
        run: npx ts-node test/windowNotifications.test.ts
      - name: Run activity ontology test
        run: npx ts-node test/activityOntology.test.ts
      - name: Run muhurta reasons test
        run: npx ts-node test/muhurtaReasons.test.ts
      - name: Run timing search test
        run: npx ts-node test/timingSearch.test.ts
      - name: Run timing search API validation test
        run: npx ts-node test/timingSearchApi.test.ts
      - name: Run panchang day service test
        run: npx ts-node test/panchangDay.test.ts
      - name: Run panchang month service test
        run: npx ts-node test/panchangMonth.test.ts
      - name: Run window overlap test
        run: npx ts-node test/windowOverlap.test.ts
      - name: Run day activity suggestions test
        run: npx ts-node test/dayActivitySuggestions.test.ts
      - name: Run everyday activity catalog test
        run: npx ts-node test/activityCatalogEveryday.test.ts
      - name: Run Muhurtham Finder test
        run: npx ts-node test/muhurthamFinder.test.ts
      - name: Run Muhurtham search API validation test
        run: npx ts-node test/muhurthamSearchApi.test.ts
      - name: Run Muhurta rule packs test
        run: npx ts-node test/muhurtaRulePacks.test.ts
      - name: Run Personal Muhurtham test
        run: npx ts-node test/personalMuhurtham.test.ts
      - name: Run SavedPerson request validation test
        run: npx ts-node test/savedPersonRequest.test.ts
      - name: Run SavedPerson natal context test
        run: npx ts-node test/savedPersonNatalContext.test.ts
      - name: Run Shared Muhurtham test
        run: npx ts-node test/sharedMuhurtham.test.ts
      - name: Run everyday shared timing fit test
        run: npx ts-node test/everydayTimingFit.test.ts
      - name: Run score engine test
        run: npx ts-node test/scoreEngine.test.ts
      - name: Run Aura Moment alternatives (rescheduling) test
        run: npx ts-node test/auraMomentAlternatives.test.ts
      - name: Run Aura Moment request validation test
        run: npx ts-node test/auraMomentRequest.test.ts
      - name: Run Aura Updates test
        run: npx ts-node test/auraUpdates.test.ts
      - name: Run product metrics test
        run: npx ts-node test/productMetrics.test.ts
      - name: Run Home dashboard time-left formatting test
        run: npx ts-node test/formatTimeLeft.test.ts
      # test/savedPersonDb.test.ts, test/auraMomentsDb.test.ts,
      # test/auraUpdatesDb.test.ts, and test/productEventsDb.test.ts are
      # intentionally NOT run here -- they make real
      # INSERT/SELECT/UPDATE/DELETE calls against Postgres via a live
      # DATABASE_URL, and this job has no Postgres service provisioned. Run
      # them locally against a real database instead (see each file's own
      # doc comment for the exact command).
      - name: Install web deps
        working-directory: apps/web
        run: npm install
      # test/auraMoments.test.ts imports apps/web/lib/auraMoments.ts, which
      # imports a `next/server` TYPE (NextRequest) -- ts-node's module
      # resolution walks up from that file's own directory, so it needs
      # apps/web/node_modules (installed above) to exist, unlike every
      # other DB-free test in this job, which never import anything from
      # the `next` package.
      - name: Run Aura Moment test
        run: npx ts-node test/auraMoments.test.ts
      # test/productEvents.test.ts imports apps/web/lib/productEvents.ts,
      # which imports apps/web/lib/db.ts (for its `pg` dependency) -- same
      # apps/web/node_modules requirement as the Aura Moment test above, so
      # it also has to run after "Install web deps".
      - name: Run product events validation test
        run: npx ts-node test/productEvents.test.ts
      - name: Run Plan-with-Aura view logic test
        env:
          TS_NODE_COMPILER_OPTIONS: '{"jsx":"react"}'
        run: npx ts-node test/planWithAuraViewLogic.test.ts
      - name: Run Panchang calendar logic test
        env:
          TS_NODE_COMPILER_OPTIONS: '{"jsx":"react"}'
        run: npx ts-node test/panchangCalendarLogic.test.ts
      - name: Run Muhurtham Finder view logic test
        env:
          TS_NODE_COMPILER_OPTIONS: '{"jsx":"react"}'
        run: npx ts-node test/muhurthamFinderViewLogic.test.ts
      - name: Run Home dashboard logic test
        env:
          TS_NODE_COMPILER_OPTIONS: '{"jsx":"react"}'
        run: npx ts-node test/homeDashboardLogic.test.ts
  web-build:
    name: Next.js production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install root deps
        run: npm install
      - name: Install web deps
        working-directory: apps/web
        run: npm install
      - name: Build
        working-directory: apps/web
        env:
          # Dummy values so the build step doesn't fail on missing env vars.
          # Nothing in this project queries the DB at build time (all data
          # fetching is client-side), so these never actually get used here.
          DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder
          AUTH_SECRET: ci-placeholder-secret-not-for-production
        run: npm run build
