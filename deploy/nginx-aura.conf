# aura.voyforge.com — installed as /etc/nginx/conf.d/aura.conf on vf-1.
# Additive: a NEW file; no existing site config is edited.
#
# Traffic path: browser -> Cloudflare (proxied, orange) -> this server.
# TLS here uses a Cloudflare Origin Certificate (/srv/aura/tls/*), which
# Cloudflare trusts in "Full (strict)" mode. Not publicly trusted on its own —
# only reachable via Cloudflare by design.

# Restore the visitor's real IP from Cloudflare so the app's per-IP sign-in
# rate limiter counts people, not Cloudflare's edge nodes.
# Ranges from https://www.cloudflare.com/ips/ (refresh occasionally).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    server_name aura.voyforge.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name aura.voyforge.com;

    ssl_certificate     /srv/aura/tls/origin.crt;
    ssl_certificate_key /srv/aura/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        # Ask Aura streams SSE — don't buffer it
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
