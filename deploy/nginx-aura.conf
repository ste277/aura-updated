# aura.voyforge.com — installed as /etc/nginx/conf.d/aura.conf on vf-1.
# Additive: a NEW file; no existing site config is edited.
#
# Traffic path: browser -> Cloudflare (proxied, orange) -> this server.
# TLS uses the Cloudflare Origin Certificate already on the box for the other
# voyforge.com sites (wildcard *.voyforge.com, /etc/nginx/certs/). Not publicly
# trusted on its own — only reachable via Cloudflare by design. Referenced
# read-only; the other sites are untouched.

# Visitor real IP (CF-Connecting-IP) is already restored globally in
# nginx.conf's http block on this server, so it's not repeated here.

server {
    listen 80;
    server_name aura.voyforge.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name aura.voyforge.com;

    ssl_certificate     /etc/nginx/certs/voyforge-origin.pem;
    ssl_certificate_key /etc/nginx/certs/voyforge-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    # Kept at server level: an add_header inside a location{} would discard
    # all of these for that location.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    # frame-ancestors 'none' also covers X-Frame-Options. 'unsafe-inline' for
    # styles is required: the UI is built entirely with React inline styles.
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        # Ask Aura streams SSE — don't buffer it
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
